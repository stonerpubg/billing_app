# Render.com blueprint — deploy MRL GROUP OF COMPANIES as a web service.
#
# Data persistence is handled by Turso (a hosted libSQL/SQLite database).
# Every write is replicated to Turso within seconds, so restarts, redeploys,
# and Render's free-tier idle sleep never lose data.
#
# Before first deploy:
#   1. Create a Turso database (see DEPLOY_RENDER.md).
#   2. In the Render dashboard, set the TURSO_URL and TURSO_AUTH_TOKEN env
#      vars for this service (they are marked `sync: false` below so they
#      are NOT committed to git and are edited in the dashboard only).

services:
  - type: web
    name: mrl-group-of-companies
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore             # closest Render region to India
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data              # embedded-replica cache file lives here
      - key: SESSION_SECRET
        generateValue: true       # Render generates a random 32-byte secret on first deploy
      - key: TURSO_URL
        sync: false               # set in Render dashboard: libsql://<db>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false               # set in Render dashboard: eyJ...
